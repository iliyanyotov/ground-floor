[run]
# Ignore `#!/usr/bin/env node` shebangs so no Node install is needed
bun = true

[install]
exact = true
minimumReleaseAge = 1209600 # seconds (14 days)
minimumReleaseAgeExcludes = []

[install.cache]
dir = ".bun-cache"

[test]
# Keeps bun test out of other runners' specs, such as Playwright e2e
root = "src"

preload = ["./src/test/preload.ts"]
